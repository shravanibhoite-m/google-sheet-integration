[project]
name = "sheet-integration"
version = "0.1.0"
description = "Browser-only Google Sheets UI. Python is here to serve static files."
readme = "README.md"
requires-python = ">=3.12"
# No runtime dependencies. The app is vanilla JS in web/ and talks to Google
# directly from the browser. Python only runs the static file server.
dependencies = []

[tool.uv]
# OneDrive-synced folder: hardlinks are not supported, so copy packages instead.
link-mode = "copy"
